server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Served cross-origin: the shell (a different origin/port) loads
    # remoteEntry.js and the exposed chunks via Module Federation.
    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build output filenames are NOT content-hashed (plain main.js/
    # remoteEntry.js), so without an explicit no-cache directive browsers
    # can treat a stale cached copy as fresh (heuristic caching) after a
    # rebuild and never revalidate — a real cause of "blank page after
    # deploy" reports. ETag/Last-Modified still let nginx return 304 when
    # nothing changed.
    location ~* \.(?:html|js)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache";
    }
}
