services:
  postgres:
    image: postgres:16-alpine
    container_name: rentame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rentame}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentame}
      POSTGRES_DB: ${POSTGRES_DB:-rentame}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentame} -d ${POSTGRES_DB:-rentame}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rentame-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rentame}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rentame12345}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-rentame} ${MINIO_ROOT_PASSWORD:-rentame12345} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET_NAME:-inmuebles}
      "

  backend:
    build: ./backend
    container_name: rentame-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_NAME: ${APP_NAME:-Rentame API}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      # In-network service names — this process talks to Postgres/MinIO
      # server-side, unlike the browser-facing frontend build args below.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rentame}:${POSTGRES_PASSWORD:-rentame}@postgres:5432/${POSTGRES_DB:-rentame}
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rentame}:${POSTGRES_PASSWORD:-rentame}@postgres:5432/rentame_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-rentame}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rentame12345}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-inmuebles}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      MAX_FOTOS_INMUEBLE: ${MAX_FOTOS_INMUEBLE:-10}
      CORS_ALLOWED_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
    ports:
      - "8000:8000"
    # Dev-time bind mount: host source changes are picked up without
    # rebuilding the image, so `docker compose exec backend pytest` always
    # runs against the latest code. --reload also has uvicorn reflect edits
    # on the running server without a manual restart.
    volumes:
      - ./backend:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  shell:
    build:
      context: ./frontend
      dockerfile: shell/Dockerfile
    container_name: rentame-shell
    restart: unless-stopped
    ports:
      - "3000:80"

  inmuebles-app:
    build:
      context: ./frontend
      dockerfile: inmuebles-app/Dockerfile
      args:
        # Browser-facing address — baked into the static bundle at build
        # time, must be reachable from the host, not the docker network.
        INMUEBLES_API_URL: http://localhost:8000
    container_name: rentame-inmuebles-app
    restart: unless-stopped
    ports:
      - "3001:80"

volumes:
  postgres_data:
  minio_data:
