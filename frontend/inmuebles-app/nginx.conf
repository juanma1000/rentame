server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Served cross-origin: the shell (a different origin/port) loads
    # remoteEntry.js and the exposed chunks via Module Federation.
    add_header Access-Control-Allow-Origin * always;

    location / {
        try_files $uri $uri/ =404;
    }
}
