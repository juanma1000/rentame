server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter) client-side routing: unknown paths fall
    # back to index.html so the app's own router can resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output filenames are NOT content-hashed (plain main.js), so
    # without an explicit no-cache directive browsers can treat a stale
    # cached copy as fresh (heuristic caching) after a rebuild and never
    # revalidate — a real cause of "blank page after deploy" reports.
    # ETag/Last-Modified still let nginx return 304 when nothing changed.
    location ~* \.(?:html|js)$ {
        add_header Cache-Control "no-cache";
    }
}
